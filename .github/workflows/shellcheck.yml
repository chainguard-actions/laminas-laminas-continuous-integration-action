name: "ShellCheck"

on:
  pull_request:
  push:
    branches:
      - '[0-9]+.[0-9]+.x'
      - 'refs/pull/*'
    tags:

permissions:
  contents: read

jobs:
  shellcheck:
    name: "ShellCheck"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09" # v5

      - name: "Run ShellCheck"
        uses: "reviewdog/action-shellcheck@4c07458293ac342d477251099501a718ae5ef86e" # v1
        with:
          fail_on_error: true

name: Create major and minor tags for action

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Compile tag list
        id: tags
        run: |
          TAG="$(printf '%s' "${GITHUB_REF#refs/tags/}" | tr -d '\n\r')"
          MAJOR="v$(printf '%s' "${TAG}" | cut -d. -f1 | tr -d '\n\r')"
          MINOR="${MAJOR}.$(printf '%s' "${TAG}" | cut -d. -f2 | tr -d '\n\r')"
          safe_tags="$(printf '%s' "${MAJOR}%0A${MINOR}" | tr -d '\n\r')"
          echo "tags=${safe_tags}" >> "$GITHUB_OUTPUT"

  update-tags:
    runs-on: ubuntu-latest
    needs: [tags]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Update tags
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_ADMIN_TOKEN }}
          ORIGINAL_TAG: ${{ github.ref }}
          TAGS: ${{ needs.tags.outputs.tags }}
        run: |
          ORIGINAL_TAG="${ORIGINAL_TAG#refs/tags/}"
          while IFS= read -r TAG; do
              [ -z "${TAG}" ] && continue
              echo "Creating and pushing ${TAG}"
              git tag -f "${TAG}" "${ORIGINAL_TAG}"
              git push -f origin "${TAG}"
          done <<< "${TAGS}"

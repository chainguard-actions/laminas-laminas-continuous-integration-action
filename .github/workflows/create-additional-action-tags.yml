name: Create major and minor tags for action

on:
  release:
    types: [published]

permissions: {}

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Compile tag list
        id: tags
        run: |
          TAG="${GITHUB_REF/refs\/tags\//}"
          MAJOR="v$(echo "${TAG}" | cut -d. -f1)"
          MINOR="${MAJOR}.$(echo "${GITHUB_REF}" | cut -d. -f2)"
          SAFE_MAJOR="$(printf '%s' "${MAJOR}" | tr -d '\n\r')"
          SAFE_MINOR="$(printf '%s' "${MINOR}" | tr -d '\n\r')"
          echo "tags=${SAFE_MAJOR}%0A${SAFE_MINOR}" >> "$GITHUB_OUTPUT"

  update-tags:
    runs-on: ubuntu-latest
    needs: [tags]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Update tags
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_ADMIN_TOKEN }}
          ORIGINAL_TAG: ${{ github.ref }}
          TAGS: ${{ needs.tags.outputs.tags }}
        run: |
          ORIGINAL_TAG="${ORIGINAL_TAG/refs\/tags\//}"
          while IFS= read -r TAG; do
              echo "Creating and pushing ${TAG}"
              git tag -f "${TAG}" "${ORIGINAL_TAG}"
              git push -f origin "${TAG}"
          done <<< "${TAGS}"

name: Create major and minor tags for action

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Compile tag list
        id: tags
        env:
          GITHUB_REF_VAL: ${{ github.ref }}
        run: |
          TAG="${GITHUB_REF_VAL/refs\/tags\//}"
          MAJOR="v$(echo "${TAG}" | cut -d. -f1)"
          MINOR="${MAJOR}.$(echo "${GITHUB_REF_VAL}" | cut -d. -f2)"
          safe_major=$(printf '%s' "${MAJOR}" | tr -d '\n\r')
          safe_minor=$(printf '%s' "${MINOR}" | tr -d '\n\r')
          printf 'tags=%s%%0A%s\n' "${safe_major}" "${safe_minor}" >> "$GITHUB_OUTPUT"

  update-tags:
    runs-on: ubuntu-latest
    needs: [tags]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Update tags
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_ADMIN_TOKEN }}
          ORIGINAL_TAG_REF: ${{ github.ref }}
          TAGS: ${{ needs.tags.outputs.tags }}
        run: |
          ORIGINAL_TAG="${ORIGINAL_TAG_REF/refs\/tags\//}"
          while IFS= read -r TAG; do
            [ -z "${TAG}" ] && continue
            echo "Creating and pushing ${TAG}"
            git tag -f "${TAG}" "${ORIGINAL_TAG}"
            git push -f origin "${TAG}"
          done <<< "$(printf '%s' "${TAGS}" | tr '%0A' '\n')"

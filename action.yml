name: 'Laminas Continuous Integration'
description: 'Run a CI check for the package'
branding:
  icon: 'check'
  color: 'green'
inputs:
  job:
    description: >-
      JSON string representing the job to run. SECURITY: the job's "command",
      "before_script" and "after_script" entries are executed as shell commands
      by design. Only pass trusted data (e.g. the output of
      laminas/laminas-ci-matrix-action); never build this value from untrusted
      input such as PR titles, branch names or issue bodies.
    required: true
runs:
  using: 'docker'
  image: 'docker://ghcr.io/laminas/laminas-continuous-integration:1@sha256:3f0dd7573f0e6e3a6e4f1c0d03b3e5131167277de87d4c677966d00d03fe6201'
  args:
    - ${{ inputs.job }}

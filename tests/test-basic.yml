name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Empty command causes entrypoint to exit 0 immediately after printing the job,
          # skipping PHP setup, composer install, and checkout — safe for act environment.
          job: '{"php":"8.2","extensions":[],"ini":[],"dependencies":"latest","ignore_php_platform_requirement":false,"command":"","continue_on_error":false}'
      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"

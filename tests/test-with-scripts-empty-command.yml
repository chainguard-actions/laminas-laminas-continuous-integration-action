name: Test before_script and after_script with empty command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: action
        uses: .
        with:
          job: >-
            {"command":"","php":"8.1","extensions":[],"ini":["memory_limit=-1"],
            "dependencies":"locked","before_script":["echo before"],"after_script":["echo after"]}
      - name: Assert action succeeded with scripts and empty command
        run: |
          echo "Action completed successfully (exit 0)"
          echo "PASS: before_script/after_script with empty command exits 0 as expected"

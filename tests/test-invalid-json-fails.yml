name: Test invalid JSON job input causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid JSON
        id: action
        # When the job argument is not valid JSON, jq will fail and the
        # entrypoint will exit non-zero due to set -e / set -o pipefail
        uses: .
        with:
          job: 'not-valid-json'
        continue-on-error: true
      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid JSON, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid JSON input"

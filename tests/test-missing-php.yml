name: Test missing PHP version fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with missing PHP version
        id: action
        uses: .
        continue-on-error: true
        with:
          job: '{"extensions":[],"ini":[],"dependencies":"locked","command":"echo hello"}'
      - name: Assert action failed due to missing PHP version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (missing PHP version or image unavailable)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when PHP version is missing"
            exit 1
          elif [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

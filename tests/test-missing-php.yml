name: Test missing PHP version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with command but no PHP version
        id: action
        continue-on-error: true
        uses: .
        with:
          job: '{"extensions":[],"ini":[],"dependencies":"locked","command":"echo hello"}'
      - name: Assert action failed due to missing PHP
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when PHP version is missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when PHP version was missing"

name: Test empty command exits successfully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          job: '{"command":"","php":"8.2","extensions":[],"ini":[],"dependencies":"locked"}'
      - name: Assert action succeeded with empty command
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited successfully with empty command"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness due to sentinel repo or event type)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test non-empty command with unsupported event type fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with non-empty command under workflow_dispatch event
        id: action
        uses: .
        continue-on-error: true
        with:
          job: '{"php":"8.2","extensions":[],"ini":[],"dependencies":"locked","command":"echo hello-from-laminas-ci"}'
      - name: Assert action failed due to unsupported event type
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with unsupported event type workflow_dispatch"
            exit 1
          fi
          echo "PASS: action correctly rejected unsupported event type"

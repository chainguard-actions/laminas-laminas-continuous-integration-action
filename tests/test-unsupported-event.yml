name: Test unsupported event type fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
        with:
          # Provide a valid command and PHP so the entrypoint reaches the checkout step
          job: '{"command":"echo hello","php":"8.2","extensions":[],"ini":[],"dependencies":"locked"}'
      - name: Assert action failed due to unsupported event type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected for unsupported event type 'workflow_dispatch'"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for unsupported event type"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test minimal job JSON - empty command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          job: >-
            {
              "php": "8.1",
              "extensions": [],
              "ini": [],
              "dependencies": "latest",
              "command": "",
              "ignore_php_platform_requirement": false,
              "additional_composer_arguments": ""
            }
      - name: Assert minimal job ran successfully
        run: |
          echo "Minimal job completed successfully with empty command"
          echo "PASS"

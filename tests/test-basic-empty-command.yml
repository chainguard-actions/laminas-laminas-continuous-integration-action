name: Test basic usage with empty command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with empty command
        id: action
        uses: .
        with:
          job: '{"php":"8.2","extensions":[],"ini":[],"dependencies":"locked","command":""}'
        env:
          GITHUB_TOKEN: ""
      - name: Assert action completed successfully
        run: |
          echo "Action completed with empty command - PASS"
          echo "PASS: action exited 0 as expected for empty command"

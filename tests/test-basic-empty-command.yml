name: Test basic usage with empty command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with empty command (should succeed immediately)
        id: action
        uses: .
        with:
          job: '{"php":"8.2","extensions":[],"ini":[],"dependencies":"locked","command":""}'
      - name: Assert action completed successfully
        run: |
          echo "Action completed with exit code 0 (empty command exits cleanly)"
          echo "PASS"

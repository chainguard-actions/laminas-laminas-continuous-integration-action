name: Test missing PHP version causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with command but no PHP version
        id: action
        # When command is set but php is missing, the entrypoint exits 1
        # with "Missing PHP version in job"
        uses: .
        with:
          job: '{"command":"echo hello","extensions":[],"ini":[],"dependencies":"locked"}'
        continue-on-error: true
      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when PHP version is missing, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when PHP version is missing"
